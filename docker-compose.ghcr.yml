# Tek domain: https://gimdes.abapnews.tr
# Mevcut Cloudflare Tunnel hedefi http://localhost:1300 olarak kalabilir.
# Dışarıya yalnızca Nginx portu açılır; API /v1/ altında aynı domainden erişilir.

services:
  backend:
    image: ${GIMDES_GHCR_PREFIX:-ghcr.io/lutfullahkabalak/gimdes}/backend:${GIMDES_IMAGE_TAG:-main}
    pull_policy: always
    expose:
      - "8080"
    environment:
      ADDR: ":8080"
    restart: unless-stopped

  frontend:
    image: ${GIMDES_GHCR_PREFIX:-ghcr.io/lutfullahkabalak/gimdes}/frontend:${GIMDES_IMAGE_TAG:-main}
    pull_policy: always
    expose:
      - "3000"
    environment:
      NUXT_PUBLIC_API_BASE: ""
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: ${GIMDES_GHCR_PREFIX:-ghcr.io/lutfullahkabalak/gimdes}/nginx:${GIMDES_IMAGE_TAG:-main}
    pull_policy: always
    ports:
      - "${GIMDES_FRONTEND_PUBLISH_PORT:-1300}:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
