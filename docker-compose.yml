services:
  backend:
    build:
      context: ./backend
    expose:
      - "8080"
    environment:
      ADDR: ":8080"
      # İsteğe bağlı: yukarı akış GİMDES tabanı (boşsa uygulama varsayılanını kullanır)
      # GIMDES_BASE_URL: "https://..."
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    expose:
      - "3000"
    environment:
      NUXT_PUBLIC_API_BASE: ""
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    ports:
      - "${GIMDES_FRONTEND_PUBLISH_PORT:-1300}:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
